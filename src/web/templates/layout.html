<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Staggs Hectic Trader{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/style.css" rel="stylesheet">

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/static/sw.js');
        });
      }
    </script>

    {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/">
        <i class="fa-solid fa-bolt text-gold"></i> Staggs Hectic Trader
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/strategies"><i class="fa-solid fa-flask"></i> Strategies</a></li>
        <li class="nav-item"><a class="nav-link" href="/evolution"><i class="fa-solid fa-dna"></i> Evolution</a></li>
        <li class="nav-item"><a class="nav-link" href="/backtest"><i class="fa-solid fa-vial"></i> Backtest</a></li>
        <li class="nav-item"><a class="nav-link" href="/synopsis"><i class="fa-solid fa-brain"></i> Synopsis</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings"><i class="fa-solid fa-gear"></i> Settings</a></li>
        <li class="nav-item"><a class="nav-link" href="/connect_mobile"><i class="fa-solid fa-mobile-screen"></i> Mobile</a></li>
        <li class="nav-item"><a class="nav-link text-danger" href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Flash Messages Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index: 1055;"></div>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function showToast(message, type='info') {
    const container = document.getElementById('toastContainer');
    const id = 'toast_' + Date.now();
    const html = `
    <div id="${id}" class="toast align-items-center text-white bg-${type === 'error' ? 'danger' : 'success'} border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                ${message}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
    `;
    container.insertAdjacentHTML('beforeend', html);
    const toastEl = document.getElementById(id);
    const toast = new bootstrap.Toast(toastEl);
    toast.show();
}

// Check for cookie messages
function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
}

document.addEventListener("DOMContentLoaded", () => {
    const msg = getCookie("flash_message");
    if (msg) {
        // Decode and show
        showToast(decodeURIComponent(msg).replace(/\+/g, ' '));
        // Delete cookie
        document.cookie = "flash_message=; Max-Age=0; path=/";
    }
});
</script>

{% block scripts %}{% endblock %}
</body>
</html>
