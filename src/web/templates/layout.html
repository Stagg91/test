<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Staggs Hectic Trader{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/style.css" rel="stylesheet">

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/static/sw.js');
        });
      }
    </script>

    {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/">
        <i class="fa-solid fa-bolt text-gold"></i> Staggs Hectic Trader
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/strategies"><i class="fa-solid fa-flask"></i> Strategies</a></li>
        <li class="nav-item"><a class="nav-link" href="/evolution"><i class="fa-solid fa-dna"></i> Evolution</a></li>
        <li class="nav-item"><a class="nav-link" href="/backtest"><i class="fa-solid fa-vial"></i> Backtest</a></li>
        <li class="nav-item"><a class="nav-link" href="/synopsis"><i class="fa-solid fa-brain"></i> Synopsis</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings"><i class="fa-solid fa-gear"></i> Settings</a></li>
        <li class="nav-item"><a class="nav-link" href="/connect_mobile"><i class="fa-solid fa-mobile-screen"></i> Mobile</a></li>
        <li class="nav-item"><a class="nav-link text-danger" href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
    <div id="alertContainer"></div>
    {% block content %}{% endblock %}
</div>

<script>
    // Simple flash message handler from URL params
    const urlParams = new URLSearchParams(window.location.search);
    const errorMsg = urlParams.get('error');
    const successMsg = urlParams.get('message');
    const alertContainer = document.getElementById('alertContainer');

    if (errorMsg) {
        alertContainer.innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Error:</strong> ${errorMsg}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>`;
    }
    if (successMsg) {
        alertContainer.innerHTML = `
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                ${successMsg}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>`;
    }
</script>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
