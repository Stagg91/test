<!DOCTYPE html>
<html>
<head>
    <title>Backtest - Staggs Hectic Trader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Staggs Hectic Trader</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/backtest">Backtest</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings">Settings</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
    <h1>Backtest Strategy</h1>

    <div class="card mb-4 bg-light">
        <div class="card-body">
            <h5>AI Strategy Designer</h5>
            <p>Describe your goal (e.g., "Find the best scalping strategy for ETH") and let AI configure the backtest.</p>
            <form action="/ai_backtest_config" method="post">
                <div class="input-group">
                    <input type="text" name="prompt" class="form-control" placeholder="Describe strategy...">
                    <button class="btn btn-success" type="submit">Auto-Configure</button>
                </div>
            </form>
        </div>
    </div>

    <form action="/run_backtest" method="post" target="results_frame">
        <div class="mb-3">
            <label class="form-label">Symbol</label>
            <input type="text" name="symbol" class="form-control" value="{{ config.symbol if config else 'BTCUSDT' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Initial Balance ($)</label>
            <input type="number" name="initial_balance" class="form-control" value="10000">
        </div>

        <div class="row mb-3">
            <div class="col">
                <label>Start Date (Optional)</label>
                <input type="date" name="start_time" class="form-control">
            </div>
            <div class="col">
                <label>End Date (Optional)</label>
                <input type="date" name="end_time" class="form-control">
            </div>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="rsi_enabled" value="true" {% if not config or config.rsi_enabled %}checked{% endif %}>
            <label class="form-check-label">Enable RSI Strategy</label>
        </div>

        <h4>RSI Parameters (Grid Search)</h4>
        <div class="row mb-3">
            <div class="col">
                <label>Lower Bound Start</label>
                <input type="number" name="rsi_lower_start" class="form-control" value="{{ config.rsi_lower_start if config else 20 }}">
            </div>
            <div class="col">
                <label>Lower Bound Stop</label>
                <input type="number" name="rsi_lower_stop" class="form-control" value="{{ config.rsi_lower_stop if config else 40 }}">
            </div>
            <div class="col">
                <label>Lower Bound Step</label>
                <input type="number" name="rsi_lower_step" class="form-control" value="{{ config.rsi_lower_step if config else 5 }}">
            </div>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="macd_enabled" value="true" {% if config and config.macd_enabled %}checked{% endif %}>
            <label class="form-check-label">Enable MACD (Signal Crossover)</label>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Run Backtest</button>
    </form>

    <iframe name="results_frame" style="width:100%; height:400px; border:1px solid #ccc; margin-top:20px;"></iframe>
</div>
</body>
</html>
