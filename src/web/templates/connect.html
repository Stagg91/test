<!DOCTYPE html>
<html>
<head>
    <title>Connect Mobile - JulesBot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">JulesBot</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/">Back</a></li>
        </ul>
    </div>
  </div>
</nav>
<div class="container text-center mt-5">
    <h3>Connect Mobile App</h3>
    <p>Scan this QR code with your phone camera to login instantly.</p>
    <div class="card p-4 d-inline-block shadow">
        <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR Code" width="300" height="300">
    </div>
    <p class="mt-3 text-muted">This QR code contains a temporary login token valid for this session.</p>
</div>
</body>
</html>
