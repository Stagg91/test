<!DOCTYPE html>
<html>
<head>
    <title>Settings - Trading Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">JulesBot</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/backtest">Backtest</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings">Settings</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
    <h1>Settings</h1>

    {% if message %}
    <div class="alert alert-success">{{ message }}</div>
    {% endif %}

    <form method="post">
        <div class="mb-3">
            <label class="form-label">Bybit API Key</label>
            <input type="text" name="api_key" class="form-control" value="{{ settings.api_key if settings else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Bybit API Secret</label>
            <input type="password" name="api_secret" class="form-control" value="{{ settings.api_secret if settings else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Gemini API Key (AI)</label>
            <input type="text" name="gemini_key" class="form-control" value="{{ settings.gemini_api_key if settings else '' }}">
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" name="testnet" value="true" {% if settings and settings.testnet %}checked{% endif %}>
            <label class="form-check-label">Use Testnet (for Bybit API)</label>
        </div>

        <hr>
        <h4>Paper Trading</h4>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" name="paper_trading" value="true" {% if settings and settings.paper_trading %}checked{% endif %}>
            <label class="form-check-label">Enable Paper Trading (Internal Simulation)</label>
        </div>
        <div class="mb-3">
            <label class="form-label">Paper Trading Balance</label>
            <input type="number" step="0.01" name="paper_balance" class="form-control" value="{{ settings.paper_balance if settings else '10000.0' }}">
        </div>

        <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
</div>
</body>
</html>
